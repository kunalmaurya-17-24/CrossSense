[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "crosssense"
version = "0.1.0"
description = "Reproducible geographically paired optical–SAR patch retrieval experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "rasterio>=1.4,<1.5",
  "pyproj>=3.6,<4", "torch>=2.5,<2.11", "PyYAML>=6.0.2,<7",
  "matplotlib>=3.9,<4", "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8", "jupyterlab>=4.3,<5", "ruff>=0.9,<1"]
earthengine = ["earthengine-api>=1.4,<2"]

[project.scripts]
crosssense = "crosssense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
